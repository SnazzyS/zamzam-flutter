name: zamzam_flutter
description: Zamzam mobile, matching the Swift reference on iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  go_router: 17.3.0
  http: 1.6.0
  shared_preferences: 2.5.4
  flutter_secure_storage: 10.3.1
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: MV Waheed
      fonts:
        - asset: assets/fonts/MVWaheed.otf
    - family: Faruma
      fonts:
        - asset: assets/fonts/Faruma.ttf
